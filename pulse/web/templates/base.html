<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
{% if refresh and refresh > 0 %}<meta http-equiv="refresh" content="{{ refresh }}">{% endif %}
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Pulse{% endblock %}</title>
<style>
  :root {
    --ok: #0f7b3e; --ok-bg: #e6f6ec;
    --warn: #9a6700; --warn-bg: #fff5df;
    --bad: #b3261e; --bad-bg: #fdeceb;
    --unknown: #57606a; --unknown-bg: #f0f2f4;
    --ink: #17202a; --muted: #57606a; --line: #d8dee4;
  }
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; margin: 0; color: var(--ink); background: #fafbfc; }
  header { background: #101828; color: #fff; padding: 10px 24px; display: flex; align-items: center; gap: 20px; }
  header a { color: #cdd6e1; text-decoration: none; font-size: 14px; }
  header a:hover { color: #fff; }
  header .brand { font-weight: 700; font-size: 18px; color: #fff; letter-spacing: .3px; }
  main { max-width: 1100px; margin: 24px auto; padding: 0 20px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  h2 { font-size: 16px; margin: 28px 0 8px; }
  .muted { color: var(--muted); font-size: 13px; }
  table { border-collapse: collapse; width: 100%; background: #fff; border: 1px solid var(--line); }
  th, td { border-bottom: 1px solid var(--line); padding: 8px 10px; text-align: left; font-size: 14px; }
  th { background: #f6f8fa; font-weight: 600; font-size: 13px; }
  tr:last-child td { border-bottom: 0; }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; }
  .b-healthy  { background: var(--ok-bg);  color: var(--ok); }
  .b-degraded { background: var(--warn-bg); color: var(--warn); }
  .b-down     { background: var(--bad-bg); color: var(--bad); }
  .b-unknown  { background: var(--unknown-bg); color: var(--unknown); }
  .b-open     { background: var(--bad-bg); color: var(--bad); }
  .b-acknowledged { background: var(--warn-bg); color: var(--warn); }
  .b-resolved { background: var(--ok-bg); color: var(--ok); }
  a { color: #0b57d0; text-decoration: none; }
  a:hover { text-decoration: underline; }
  button, .btn { background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 6px 14px; font-size: 14px; cursor: pointer; }
  button:hover { background: #f6f8fa; }
  form.inline { display: inline; }
  input, textarea { border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; font-size: 14px; width: 100%; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 14px; }
  .card .big { font-size: 24px; font-weight: 700; margin: 2px 0; }
  .cards { margin: 14px 0; }
  .status-hero { display: grid; gap: 10px; margin: 18px 0; }
  .status-tile { border-radius: 10px; padding: 16px 18px; border: 1px solid var(--line); background: #fff; display: flex; justify-content: space-between; align-items: center; }
  .st-healthy  { border-left: 6px solid var(--ok); }
  .st-degraded { border-left: 6px solid var(--warn); }
  .st-down     { border-left: 6px solid var(--bad); }
  .st-unknown  { border-left: 6px solid var(--unknown); }
  .timeline { list-style: none; padding: 0; margin: 0; }
  .timeline li { border-left: 2px solid var(--line); margin-left: 6px; padding: 6px 14px; position: relative; }
  .timeline li::before { content: ""; position: absolute; left: -6px; top: 12px; width: 10px; height: 10px; border-radius: 50%; background: #fff; border: 2px solid var(--muted); }
  .timeline .kind { font-weight: 600; font-size: 12px; text-transform: uppercase; color: var(--muted); margin-right: 8px; }
  .row { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
  .row > div { flex: 1; min-width: 160px; }
  footer { text-align: center; color: var(--muted); font-size: 12px; padding: 30px 0 16px; }
  .error { color: var(--bad); background: var(--bad-bg); padding: 10px 14px; border-radius: 8px; }
  /* ---- auth pages (login / signup) ---- */
  .auth-wrap { min-height: calc(100vh - 140px); display: flex; align-items: flex-start; justify-content: center; padding: 44px 16px; }
  .auth-card { width: 100%; max-width: 420px; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 28px 28px 22px; box-shadow: 0 8px 24px rgba(16,24,40,.07); }
  .auth-card h1 { font-size: 20px; margin: 0 0 4px; }
  .auth-card .sub { color: var(--muted); font-size: 14px; margin: 0 0 18px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; }
  .field input { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font-size: 15px; width: 100%; transition: border-color .15s, box-shadow .15s; }
  .field input:focus { outline: none; border-color: #0b57d0; box-shadow: 0 0 0 3px rgba(11,87,208,.13); }
  .field.invalid input { border-color: var(--bad); }
  .field .msg { color: var(--bad); font-size: 12.5px; margin-top: 5px; }
  .field .hint { color: var(--muted); font-size: 12.5px; margin-top: 5px; }
  .field .hint.ok { color: var(--ok); }
  .pw-wrap { position: relative; }
  .pw-wrap input { padding-right: 46px; }
  .pw-toggle { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); border: 0; background: transparent; cursor: pointer; font-size: 15px; padding: 6px 8px; color: var(--muted); border-radius: 6px; line-height: 1; }
  .pw-toggle:hover { background: #f0f2f4; }
  .btn-primary { display: block; width: 100%; background: #101828; color: #fff; border: 0; border-radius: 8px; padding: 11px 16px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 6px; transition: background .15s; }
  .btn-primary:hover { background: #1d2b44; }
  .banner { color: var(--bad); background: var(--bad-bg); border: 1px solid #f3c1bd; padding: 10px 12px; border-radius: 8px; font-size: 14px; margin-bottom: 16px; }
  .auth-alt { text-align: center; font-size: 14px; color: var(--muted); margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); }
  .auth-alt a { font-weight: 600; }
  header form { display: inline; margin-left: auto; }
  header button { background: transparent; color: #cdd6e1; border: 1px solid #3b4757; font-size: 13px; padding: 4px 12px; }
  header button:hover { color: #fff; border-color: #5a6675; }
  @media (max-width: 600px) {
    header { flex-wrap: wrap; gap: 10px; padding: 10px 14px; }
    main { margin: 16px auto; }
    .auth-wrap { padding: 20px 12px; }
    .auth-card { padding: 22px 18px 16px; }
  }
</style>
</head>
<body>
<header>
  <span class="brand">◉ Pulse</span>
  {% block nav %}
  <a href="/">Dashboard</a>
  <a href="/status">Public status</a>
  <a href="/metrics">Metrics</a>
  {% endblock %}
  {% if user %}
  <form method="post" action="/logout"><button type="submit">Logout ({{ user.name }})</button></form>
  {% endif %}
</header>
<main>
{% block content %}{% endblock %}
</main>
<footer>Pulse — status &amp; incident hub</footer>
{% block scripts %}{% endblock %}
</body>
</html>
